# Render blueprint — deploy the backend API.
# After the first deploy, fill in the `sync: false` secrets in the Render
# dashboard (Service → Environment). Render sets PORT itself.
services:
  - type: web
    name: smartleave-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    plan: free
    envVars:
      # ==== REQUIRED — fill in the Render dashboard after the first deploy ====
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ==== OPTIONAL — email notifications (Brevo) ====
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: smartleave@example.com
      - key: FRONTEND_URL
        sync: false
